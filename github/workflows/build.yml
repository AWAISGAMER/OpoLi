name: Build Flutter Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Files
      run: |
        sudo apt-get install -y p7zip-full
        7z x *.7z || true
        unzip -o *.zip || true
        
        PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
        if [ -n "$PUBSPEC_PATH" ]; then
          FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found pubspec.yaml in: $FLUTTER_DIR"
          if [ "$FLUTTER_DIR" != "." ]; then
            cp -r $FLUTTER_DIR/* .
          fi
        else
          echo "Error: pubspec.yaml file not found!"
          exit 1
        fi

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Dependencies and Build APK
      run: |
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpoLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
