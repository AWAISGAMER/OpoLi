workflows:
  android-workflow:
    name: Android Release APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 2.10.5
      java: 11
    scripts:
      - name: Extract Project Files
        script: | 
          sudo apt-get install -y p7zip-full
          7z x *.7z || true
          unzip -o *.zip || true
          
          # Find directory containing pubspec.yaml
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
            echo "Found Flutter app at: $FLUTTER_DIR"
            if [ "$FLUTTER_DIR" != "." ]; then
              shopt -s dotglob
              cp -r "$FLUTTER_DIR"/* .
            fi
          fi
          
          # Force check AndroidManifest location
          MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
          echo "Manifest found at: $MANIFEST_PATH"
      - name: Get Flutter packages
        script: | 
          flutter packages pub get
      - name: Build Release APK
        script: | 
          flutter build apk --release --no-tree-shake-icons --ignore-deprecation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
