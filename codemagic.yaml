workflows:
  android-workflow:
    name: Android Release APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Extract Project Files & Upgrade Embedding
        script: | 
          sudo apt-get install -y p7zip-full
          7z x *.7z || true
          unzip -o *.zip || true
          
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
            if [ "$FLUTTER_DIR" != "." ]; then
              shopt -s dotglob
              cp -r "$FLUTTER_DIR"/* .
            fi
          fi

          # Locate AndroidManifest.xml
          MANIFEST_FILE=$(find android/ -name "AndroidManifest.xml" | head -n 1)
          echo "Manifest Path: $MANIFEST_FILE"

          if [ -f "$MANIFEST_FILE" ]; then
            # Inject v2 embedding tag if not present
            if ! grep -q "flutterEmbedding" "$MANIFEST_FILE"; then
              sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST_FILE"
            fi
          fi

          # Fix MainActivity imports if legacy
          find android/ -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r file; do
            sed -i 's/import io.flutter.app.FlutterActivity;/import io.flutter.embedding.android.FlutterActivity;/' "$file"
          done
      - name: Get Flutter packages
        script: | 
          flutter pub get
      - name: Build Release APK
        script: | 
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
